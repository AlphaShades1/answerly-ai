<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow" /><meta charset="utf-8"><title>Can it read a graph?</title>
<style>body{font-family:system-ui;padding:20px}
#log{font-family:ui-monospace,monospace;font-size:13px;white-space:pre;background:#111;color:#ddd;padding:12px;border-radius:6px}
.pass{color:#4ade80}.fail{color:#f87171}canvas{border:1px solid #ccc;margin:6px}</style>
</head>
<body>
<h3>AD/AS graph reading — the question type this student keeps losing</h3>
<p>Three charts with a known answer. Each is drawn, rasterised, and sent to the
same model and prompt the extension uses for screenshots.</p>
<div id="charts"></div>
<div id="log">waiting for key…</div>

<script>
// Each chart: AS rising, AD lines, a marked new equilibrium at a known GDP.
const CASES = [
  { name: 'shift right to AD1', adShift: +90,  label: 'AD1' },
  { name: 'shift left to AD1',  adShift: -90,  label: 'AD1' },
  { name: 'shift right to AD2', adShift: +150, label: 'AD2' },
];

// Axis: x = Real GDP 0..70 mapped to 60..440 px, y = price level 0..70.
const X0 = 60, X1 = 440, Y0 = 340, Y1 = 40, GMIN = 0, GMAX = 70;
// The expected answer must come from the drawing, not from a number typed by
// hand. AD is drawn through (5+d, 60) and (60+d, 5), slope -1, so y = 65+d-x;
// AS is y = x; they meet at x = (65+d)/2. Getting this wrong once already made
// a correct model look badly broken.
const shiftPxFor = adShift => adShift * (X1 - X0) / ((GMAX - GMIN) * 10) * 10 / 9;
const shiftUnits = adShift => shiftPxFor(adShift) / ((X1 - X0) / (GMAX - GMIN));
const trueAnswer = adShift => (65 + shiftUnits(adShift)) / 2;
const sx = v => X0 + (v - GMIN) / (GMAX - GMIN) * (X1 - X0);
const sy = v => Y0 - (v - GMIN) / (GMAX - GMIN) * (Y0 - Y1);

function drawChart(c, cs) {
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = '#000'; g.lineWidth = 1.5; g.font = '13px system-ui'; g.fillStyle = '#000';
  // axes
  g.beginPath(); g.moveTo(X0, Y1); g.lineTo(X0, Y0); g.lineTo(X1, Y0); g.stroke();
  g.fillText('Price Level', 8, 30);
  g.fillText('Real GDP ($ billions)', X1 - 150, Y0 + 34);
  // gridlines + ticks every 10 so a value can actually be read off
  g.font = '12px system-ui';
  for (let v = 10; v <= 70; v += 10) {
    g.strokeStyle = '#e0e0e0'; g.beginPath(); g.moveTo(sx(v), Y0); g.lineTo(sx(v), Y1); g.stroke();
    g.strokeStyle = '#000'; g.beginPath(); g.moveTo(sx(v), Y0); g.lineTo(sx(v), Y0 + 5); g.stroke();
    g.fillText(String(v), sx(v) - 7, Y0 + 19);
    g.strokeStyle = '#e0e0e0'; g.beginPath(); g.moveTo(X0, sy(v)); g.lineTo(X1, sy(v)); g.stroke();
    g.strokeStyle = '#000'; g.beginPath(); g.moveTo(X0 - 5, sy(v)); g.lineTo(X0, sy(v)); g.stroke();
    g.fillText(String(v), X0 - 26, sy(v) + 4);
  }
  // AS: price level = GDP (45 degrees) so equilibrium GDP == the AD crossing
  g.strokeStyle = '#111'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(sx(5), sy(5)); g.lineTo(sx(65), sy(65)); g.stroke();
  g.fillText('AS', sx(66), sy(65));
  // AD0 through (32,32); AD1/AD2 shifted horizontally
  const drawAD = (shiftPx, label, colour) => {
    g.strokeStyle = colour; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(sx(5) + shiftPx, sy(60)); g.lineTo(sx(60) + shiftPx, sy(5)); g.stroke();
    g.fillStyle = colour; g.fillText(label, Math.min(sx(60) + shiftPx + 6, X1 - 24), sy(5));
    g.fillStyle = '#000';
  };
  drawAD(0, 'AD', '#0057d8');
  drawAD(shiftPxFor(cs.adShift), cs.label, '#d81b60');
  // No marker: the real quiz charts make you find the crossing yourself.
}

const BASE_PROMPT = 'Read this graph and answer with ONLY the new equilibrium Real GDP as a number, nothing else. '
  + 'The new equilibrium is where the shifted aggregate demand curve crosses the aggregate supply curve.';
const MEASURE_PROMPT = 'Read this graph carefully. Find where the shifted aggregate demand curve crosses the '
  + 'aggregate supply curve. Work out that crossing point&apos;s horizontal position relative to the labelled '
  + 'x-axis gridlines, which are 10 apart, and interpolate between the two it falls between. '
  + 'Reply with ONLY the Real GDP number, nothing else.';
const VARIANTS = [
  { name: 'baseline 1x',         scale: 1, prompt: BASE_PROMPT },
  { name: 'hi-res 3x',           scale: 3, prompt: BASE_PROMPT },
  { name: 'measure prompt 1x',   scale: 1, prompt: MEASURE_PROMPT },
  { name: 'hi-res 3x + measure', scale: 3, prompt: MEASURE_PROMPT },
];

window.run = async function () {
  const out = [];
  for (const V of VARIANTS) {
   for (const cs of CASES) {
    const c = document.createElement('canvas');
    c.width = 520 * V.scale; c.height = 380 * V.scale;
    c.style.width = '250px';
    document.getElementById('charts').appendChild(c);
    c.getContext('2d').scale(V.scale, V.scale);
    drawChart(c, cs);
    const b64 = c.toDataURL('image/png').split(',')[1];
    const PROMPT = V.prompt;
    const runs = [];
    for (let i = 0; i < 1; i++) {
      try {
        // Local proxy holds the key; the page never sees it.
        const r = await fetch('http://localhost:3999/solve', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ b64, prompt: PROMPT }),
        });
        const j = await r.json();
        runs.push(j.text);
      } catch (e) { runs.push('THREW ' + e.message); }
    }
    // Within 1 unit counts: the quiz offers discrete choices, so landing close
    // enough to pick the right one is the bar that actually matters.
    const want = trueAnswer(cs.adShift);
    const near = runs.filter(t => {
      const n = parseFloat(String(t).replace(/[^0-9.]/g, ''));
      return isFinite(n) && Math.abs(n - want) <= 1;
    }).length;
    out.push({ variant: V.name, name: cs.name, answer: want.toFixed(2), hit: near, runs: [...new Set(runs)] });
   }
  }
  const byVariant = {};
  out.forEach(o => { (byVariant[o.variant] = byVariant[o.variant] || []).push(o); });
  document.getElementById('log').innerHTML = Object.entries(byVariant).map(([v, rows]) => {
    const got = rows.reduce((a, o) => a + o.hit, 0);
    return `<span class="${got === rows.length ? 'pass' : 'fail'}">${got}/${rows.length}</span>  ${v}` + '\n' +
      rows.map(o => `        want ${String(o.answer).padStart(3)}   got ${o.runs.map(r => String(r).slice(0, 14)).join(' | ')}`).join('\n');
  }).join('\n\n');
  window.__out = out; window.__done = true;
  return 'done';
};
document.getElementById('log').textContent = 'ready — call run()';
run();
</script>
</body>
</html>
