<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Cross-question + notes prompt harness</title>
<style>body{font-family:system-ui;margin:16px} .question{border:1px solid #ddd;margin:8px 0;padding:8px}</style>
</head>
<body>
<h1 id="qtitle">Quiz</h1>
<div id="quiz"></div>

<script>
// ── knobs: ?engine=classic|nq &title=... &stealth=1 &notes=1 &fresh=1 ─────────
const P = new URLSearchParams(location.search);
const ENGINE = P.get('engine') || 'classic';
document.getElementById('qtitle').textContent = P.get('title') || 'Unit 3 Review Quiz';

// chrome.storage.local, persisted in the harness's own localStorage so a page
// reload behaves like the real extension storage surviving a navigation.
const KEY = 'harnessChromeStore';
if (P.get('fresh')) localStorage.removeItem(KEY);
const store = JSON.parse(localStorage.getItem(KEY) || '{}');
Object.assign(store, {
  answerlySession: { code: 'ANS-HARNESS', token: 't' },
  answerlyQuizActive: true,
  answerlyQuizStealthActive: P.get('stealth') === '1',
});
if (P.get('notes') === '1') store.answerlyContextFile = { fileName: 'notes.pdf', context: 'Lecture notes...' };
else delete store.answerlyContextFile;
const persist = () => localStorage.setItem(KEY, JSON.stringify(store));
persist();
const changeListeners = [];
window.sent = [];
window.chrome = {
  runtime: {
    id: 'harness', lastError: null, getURL: p => p,
    onMessage: { addListener(f) { (window.msgListeners = window.msgListeners || []).push(f); } },
    sendMessage(msg, cb) {
      cb = cb || (() => {});
      if (msg.type === 'SOLVE_QUESTION' || msg.type === 'SOLVE_MATCHING') {
        window.sent.push(msg);
        const first = (msg.options && msg.options[0]) || 'x';
        setTimeout(() => cb({ hint: 'h', answer: first, answerParts: [first], solveId: 's' + window.sent.length }), 50);
        return;
      }
      cb({});
    },
  },
  storage: {
    local: {
      get(keys, cb) {
        const list = keys == null ? Object.keys(store) : Array.isArray(keys) ? keys : typeof keys === 'string' ? [keys] : Object.keys(keys);
        const out = {}; list.forEach(k => { if (k in store) out[k] = JSON.parse(JSON.stringify(store[k])); });
        setTimeout(() => cb(out), 0);
      },
      set(obj, cb) {
        const ch = {}; Object.keys(obj).forEach(k => { ch[k] = { oldValue: store[k], newValue: obj[k] }; store[k] = obj[k]; });
        persist(); changeListeners.forEach(f => f(ch, 'local')); cb && setTimeout(cb, 0);
      },
      remove(keys, cb) { [].concat(keys).forEach(k => delete store[k]); persist(); cb && cb(); },
    },
    onChanged: { addListener(f) { changeListeners.push(f); } },
  },
};
window.harnessStore = store;
// Deliver a runtime message (e.g. SOLVE_ALL from the popup) to every listener.
window.deliver = (msg) => (window.msgListeners || []).forEach(f => { try { f(msg, {}, () => {}); } catch (e) { console.error(e); } });

// ── New Quizzes: one question at a time, React-style in-place swap ──────────
const NQ_QUESTIONS = [
  { stem: 'What is Andrew Foster best known for? Select all that apply.', type: 'checkbox', opts: ['Establishing 31 schools in 13 African countries', 'Speaking throughout Europe', 'Being one of the first Black Deaf students at Gallaudet'] },
  { stem: 'How many schools for the Deaf did Andrew Foster personally establish in Africa?', type: 'radio', opts: ['more than 300', '31-32 schools', '70-71', '13-17'] },
  { stem: 'How old was Andrew when he lost his hearing?', type: 'radio', opts: ['7 years old', '2 years old', '8 years old', '11 years old'] },
];
window.nqShow = (i) => {
  const q = NQ_QUESTIONS[i];
  document.getElementById('quiz').innerHTML = `
    <div data-automation="sdk-item-wrapper">
      <div data-automation="sdk-position-box-text">Question ${i + 1}</div>
      <div tabindex="-1"><div class="user_content enhanced"><p>${q.stem}</p></div></div>
      <div role="${q.type === 'radio' ? 'radiogroup' : 'group'}">
        ${q.opts.map(o => `<label><input type="${q.type}" name="nq${i}"><span class="user_content enhanced">${o}</span></label>`).join('')}
      </div>
    </div>`;
};
</script>

<script>
(async () => {
  if (ENGINE === 'classic') {
    // Real Classic markup: the 11-question compatibility quiz.
    const html = await (await fetch('quiz.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('.question_holder').forEach(h => document.getElementById('quiz').appendChild(document.importNode(h, true)));
  } else {
    nqShow(Number(P.get('q') || 0));
  }
  // Both engines are loaded on every Canvas course page, exactly as the manifest does.
  for (const f of ['newQuizSolver.js', 'quizSolver.js']) {
    await new Promise(r => { const s = document.createElement('script'); s.src = (P.get('code') === 'old' ? '/test-canvas/old138/' : '/extension/content/') + f + '?v=' + Date.now(); s.onload = r; document.body.appendChild(s); });
  }
  window.__loaded = true;
})();
</script>
</body>
</html>
