<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow" /><meta charset="utf-8"><title>Keybind sweep (Classic)</title>
<style>body{font-family:system-ui;padding:20px;max-width:1000px}
.question.display_question{border:1px solid #cbd;margin:14px 0;padding:10px}
#log{font-family:ui-monospace,monospace;font-size:12px;white-space:pre;background:#111;color:#ddd;padding:12px;border-radius:6px}
.pass{color:#4ade80}.fail{color:#f87171}</style>
</head>
<body>
<h1 id="quiz_title">Unit 2 Quiz</h1>
<p>Both Classic keybinds, on the paths a student actually hits: a cold press, a
second press on the same question, a press after Solve All has already answered
it, and a press with the cursor level with the question but not over it.</p>
<div id="quiz"></div>
<div id="log">running…</div>

<script>
const BANK = [
  { id:'mc', q:'Which dependency is inherent in the nature of the work?',
    opts:['Mandatory','Discretionary','External','Internal'], key:'Mandatory' },
  { id:'tf', q:'A kanban board usually includes To Do, In Progress and Done.',
    opts:['True','False'], key:'True' },
];
function render() {
  document.getElementById('quiz').innerHTML = BANK.map((b, i) =>
    '<div class="question_holder"><div id="question_' + (100+i) + '" class="question display_question" data-id="' + b.id + '">' +
      '<div class="question_name">Question ' + (i+1) + '</div>' +
      '<div class="question_text"><p>' + b.q + '</p></div>' +
      '<div class="answers">' + b.opts.map(o =>
        '<div class="answer"><label><input type="radio" name="question_' + (100+i) + '">' +
        '<span class="answer_label">' + o + '</span></label></div>').join('') +
      '</div></div></div>').join('');
}
render();

const sent = [];
const store = {
  answerlySession: { code: 'ANS-TEST' },
  answerlyQuizActive: true,
  answerlyQuizStealthActive: true,
  answerlyScreenshotActive: false,
  answerlyScreenshotStealthActive: false,
  answerlyStealthKeybind:    { enabled: true, key: 'q' },
  answerlyScreenshotKeybind: { enabled: true, key: 'e' },
};
const changeListeners = [], msgListeners = [];
function keyFor(question) {
  const b = BANK.find(x => question && question.includes(x.q.slice(0, 40)));
  return b ? [b.key] : null;
}
window.chrome = {
  runtime: {
    lastError: null,
    onMessage: { addListener(fn) { msgListeners.push(fn); } },
    getURL: p => p,
    sendMessage(msg, cb) {
      sent.push(JSON.parse(JSON.stringify(msg)));
      if (typeof cb !== 'function') return;
      setTimeout(() => {
        if (msg.type === 'SOLVE_QUESTION') {
          const parts = keyFor(msg.question);
          if (!parts) return cb({ error: 'no key for that question' });
          return cb({ solveId: 'sid-' + sent.length, answer: parts.join(', '),
                      answerParts: parts, hint: 'because the textbook says so' });
        }
        // The crop overlay is interactive, so stop the capture right after the
        // engine asks for the tab image. Reaching this IS the assertion.
        if (msg.type === 'CAPTURE_SCREENSHOT') return cb({ error: 'harness stops here' });
        cb({ solveId: 'sid-' + sent.length, answer: 'ok' });
      }, 30);
    },
  },
  storage: {
    local: {
      get(keys, cb) { const l = Array.isArray(keys) ? keys : [keys]; const o = {};
        l.forEach(k => { if (k in store && store[k] !== null) o[k] = store[k]; }); cb(o); },
      set(obj, cb) {
        const ch = {}; Object.keys(obj).forEach(k => { ch[k] = { oldValue: store[k], newValue: obj[k] }; store[k] = obj[k]; });
        changeListeners.forEach(fn => fn(ch, 'local')); if (cb) cb();
      },
      remove(keys, cb) { (Array.isArray(keys) ? keys : [keys]).forEach(k => delete store[k]); if (cb) cb(); },
    },
    onChanged: { addListener(fn) { changeListeners.push(fn); } },
  },
};
const post = m => msgListeners.forEach(fn => fn(m, {}, () => {}));
const tick = ms => new Promise(r => setTimeout(r, ms));
</script>

<script src="/extension/content/quizSolver.js"></script>

<script>
const results = [];
const LOG = document.getElementById('log');
function check(name, ok, detail) {
  results.push({ name: name, ok: ok, detail: detail });
  LOG.innerHTML += '<span class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'PASS  ' : 'FAIL  ') +
    name + '</span>' + (detail !== undefined ? '\n       ' + detail : '') + '\n';
}
const qEl = id => document.querySelector('.question.display_question[data-id="' + id + '"]');
const selected = id => [...qEl(id).querySelectorAll('input:checked')]
  .map(i => i.closest('label').innerText.trim());
function reset() {
  document.querySelectorAll('input:checked').forEach(i => { i.checked = false; });
  document.querySelectorAll('.answerly-btn').forEach(b => {
    delete b.dataset.done; delete b.dataset.opened; b.dataset.busy = '';
  });
  sent.length = 0;
}
// Presses the key over a question and waits until it lands, or times out.
async function press(id, key, opts) {
  const o = opts || {};
  const budgetMs = o.budgetMs || 8000;
  const q = qEl(id);
  q.scrollIntoView({ block: 'center' });
  await tick(250);
  const r = q.getBoundingClientRect();
  // level:true puts the cursor in the left margin - beside the question, not on
  // it - which is where a real cursor often sits.
  const x = o.level ? Math.max(1, Math.round(r.left - 5)) : Math.round(r.left + 20);
  const y = Math.round(r.top + 20);
  document.dispatchEvent(new MouseEvent('mousemove', { clientX: x, clientY: y, bubbles: true }));
  await tick(120);
  const t0 = performance.now();
  document.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true }));
  const want = key === 'q' ? 'SOLVE_QUESTION' : 'CAPTURE_SCREENSHOT';
  for (let t = 0; t < budgetMs / 100; t++) {
    await tick(100);
    if (sent.some(s => s.type === want)) return Math.round(performance.now() - t0);
  }
  return null;
}

(async () => {
  LOG.innerHTML = '';
  await tick(2500);

  const btn = qEl('mc').querySelector('.answerly-btn:not(.answerly-cam-btn)');
  check('setup: stealth ? button injected and invisible',
        !!btn && getComputedStyle(btn).opacity === '0', btn ? getComputedStyle(btn).opacity : 'no button');

  // 1. cold press
  reset();
  let ms = await press('mc', 'q');
  check('solve keybind: fires on a cold press', ms !== null, ms === null ? 'never fired' : ms + 'ms');
  await tick(700);
  check('solve keybind: answer auto-selected', JSON.stringify(selected('mc')) === '["Mandatory"]',
        JSON.stringify(selected('mc')));
  check('solve keybind: left the other question alone', selected('tf').length === 0,
        JSON.stringify(selected('tf')));

  // 2. second press on the same question must re-solve, not no-op
  sent.length = 0;
  ms = await press('mc', 'q');
  check('solve keybind: fires again on an already-solved question',
        ms !== null, ms === null ? 'never fired - second press is a no-op' : ms + 'ms');

  // 2b. TWO presses inside the 1200ms double-click window.
  // shouldIgnoreClick() drops a click within 1200ms of the last one. That is
  // right for a mouse and wrong for a key: a student whose first press looked
  // like it did nothing presses again straight away, and that second press was
  // being swallowed in silence. Deliberately timed to land INSIDE the window,
  // because a test that waits longer than 1200ms passes either way - which is
  // how this went unnoticed.
  reset();
  await press("mc", "q");
  await tick(300);
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "q", bubbles: true }));
  await tick(4000);
  const rapid = sent.filter(s => s.type === "SOLVE_QUESTION").length;
  check("solve keybind: a second press 300ms later is NOT swallowed",
        rapid === 2, "SOLVE_QUESTION x" + rapid + (rapid < 2 ? "  <-- debounced away" : ""));

  // 3. press after Solve All already answered it
  reset();
  post({ type: 'SOLVE_ALL' });
  await tick(6000);
  sent.length = 0;
  ms = await press('tf', 'q');
  check('solve keybind: fires after Solve All has answered the question',
        ms !== null, ms === null ? 'never fired - Solve All kills the keybind' : ms + 'ms');

  // 4. cursor level with the question but not over it
  reset();
  ms = await press('mc', 'q', { level: true });
  check('solve keybind: fires with the cursor level with the question',
        ms !== null, ms === null ? 'never fired' : ms + 'ms');

  // 5. screenshot keybind, twice
  chrome.storage.local.set({ answerlyScreenshotActive: true, answerlyScreenshotStealthActive: true });
  await tick(2500);
  const cam = qEl('mc').querySelector('.answerly-cam-btn');
  check('setup: camera button injected', !!cam, cam ? 'yes' : 'missing');
  reset();
  ms = await press('mc', 'e');
  check('screenshot keybind: fires on a cold press', ms !== null, ms === null ? 'never fired' : ms + 'ms');
  await tick(1500);
  sent.length = 0;
  ms = await press('mc', 'e');
  check('screenshot keybind: fires a SECOND time (busy lock released)',
        ms !== null, ms === null ? 'never fired - lock never released' : ms + 'ms');

  // 6. must stay silent outside stealth
  chrome.storage.local.set({ answerlyQuizStealthActive: false });
  await tick(2500);
  reset();
  ms = await press('tf', 'q', { budgetMs: 2000 });
  check('solve keybind: correctly does NOT fire outside Quiz Stealth',
        ms === null, ms === null ? 'silent, as designed' : 'fired in ' + ms + 'ms');

  const pass = results.filter(r => r.ok).length;
  LOG.innerHTML += '\n' + pass + '/' + results.length + ' passed';
  window.__done = true;
})();
</script>
</body>
</html>
