<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow" /><meta charset="utf-8">
  <title>Stealth overflow capture - Classic</title>
<style>
  body{font-family:system-ui;margin:0;padding:20px;max-width:900px;background:#f5f5f5;color:#2d3b45}
  .question_holder{margin-bottom:22px}
  .question.display_question{background:#fff;border:1px solid #c7cdd1;border-radius:4px}
  .question_name{background:#f5f5f5;border-bottom:1px solid #c7cdd1;padding:9px 16px;font-weight:700}
  .question_text{padding:16px;line-height:1.6}
  .answers{padding:0 16px 16px}
  .answer{margin:6px 0;padding:7px 10px;display:flex;gap:10px}
  .figure{background:linear-gradient(#dde,#bcd);border:1px solid #99a;margin:12px 0}
  #log{position:fixed;right:8px;top:8px;width:440px;max-height:94vh;overflow:auto;
       font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;
       background:#111;color:#ddd;padding:10px;border-radius:6px;z-index:2147483646}
  .pass{color:#4ade80}.fail{color:#f87171}
</style>
</head>
<body>
<h1>Classic overflow capture</h1>

<!-- A. CONTROL: short question, fits on screen. Must stay at ONE image. -->
<div class="question_holder">
<div class="question display_question" id="question_1" data-question-type="multiple_choice_question">
  <div class="question_name"><span>Question 1</span></div>
  <div class="question_text">What is the capital of France?</div>
  <div class="answers">
    <div class="answer"><input type="radio" name="q1"><label class="answer_label">Paris</label></div>
    <div class="answer"><input type="radio" name="q1"><label class="answer_label">Rome</label></div>
  </div>
</div>
</div>

<!-- B. REGRESSION: tall question with the figure INSIDE the container. This
     already captured extra frames before the change and must still do so. -->
<div class="question_holder">
<div class="question display_question" id="question_2" data-question-type="multiple_choice_question">
  <div class="question_name"><span>Question 2</span></div>
  <div class="question_text">
    Study the figure and choose the correct reading.
    <div class="figure" style="height:1400px"></div>
  </div>
  <div class="answers">
    <div class="answer"><input type="radio" name="q2"><label class="answer_label">Rising</label></div>
    <div class="answer"><input type="radio" name="q2"><label class="answer_label">Falling</label></div>
  </div>
</div>
</div>

<!-- C. THE NEW CASE: the question container holds only the stem; the figure and
     the choices are laid out AFTER it, before the next question. Canvas's own
     box says this question is ~80px tall, so the old gate bailed instantly. -->
<div class="question_holder">
<div class="question display_question" id="question_3" data-question-type="multiple_choice_question">
  <div class="question_name"><span>Question 3</span></div>
  <div class="question_text">Which policy does the graph below support?</div>
</div>
<div class="figure" style="height:1300px"></div>
<div class="answers" style="background:#fff;border:1px solid #c7cdd1">
  <div class="answer"><input type="radio" name="q3"><label class="answer_label">Expansionary</label></div>
  <div class="answer"><input type="radio" name="q3"><label class="answer_label">Contractionary</label></div>
</div>
</div>

<!-- A trailing question so #3 is never the last one on the page. -->
<div class="question_holder">
<div class="question display_question" id="question_4" data-question-type="multiple_choice_question">
  <div class="question_name"><span>Question 4</span></div>
  <div class="question_text">Unrelated closing question.</div>
  <div class="answers">
    <div class="answer"><input type="radio" name="q4"><label class="answer_label">Yes</label></div>
  </div>
</div>
</div>

<div id="log">running…</div>

<script>
// A real viewport-sized PNG, so cropStealthImage's scaling maths runs for real.
function fakeShot() {
  const c = document.createElement('canvas');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#333'; g.font = '20px monospace';
  g.fillText('scrollY=' + Math.round(window.scrollY), 20, 40);
  return c.toDataURL('image/png');
}

const captures = [];
const solves   = [];
const store = {
  answerlySession: { code: 'ANS-TEST', token: 't' },
  answerlyQuizActive: true,
  answerlyQuizStealthActive: false,
  answerlyScreenshotActive: true,
  answerlyScreenshotStealthActive: true,
};
const changeListeners = [], msgListeners = [];
window.chrome = {
  runtime: {
    lastError: null,
    onMessage: { addListener(fn) { msgListeners.push(fn); } },
    getURL: p => p,
    sendMessage(msg, cb) {
      if (msg.type === 'CAPTURE_SCREENSHOT') {
        captures.push({ scrollY: Math.round(window.scrollY) });
        if (cb) setTimeout(() => cb({ dataUrl: fakeShot() }), 5);
        return;
      }
      if (msg.type === 'SOLVE_SCREENSHOT_STEALTH') {
        solves.push({ hasImage: !!msg.image, n: Array.isArray(msg.images) ? msg.images.length : 1 });
        if (cb) setTimeout(() => cb({ answer: 'A', answerText: 'Expansionary' }), 5);
        return;
      }
      if (cb) setTimeout(() => cb({ ok: true }), 5);
    },
  },
  storage: {
    local: {
      get(keys, cb) { const l = Array.isArray(keys) ? keys : [keys]; const o = {};
        l.forEach(k => { if (k in store && store[k] !== null) o[k] = store[k]; }); cb(o); },
      set(obj, cb) { const ch = {};
        Object.keys(obj).forEach(k => { ch[k] = { oldValue: store[k], newValue: obj[k] }; store[k] = obj[k]; });
        changeListeners.forEach(fn => fn(ch, 'local')); if (cb) cb(); },
      remove(keys, cb) { (Array.isArray(keys) ? keys : [keys]).forEach(k => delete store[k]); if (cb) cb(); },
    },
    onChanged: { addListener(fn) { changeListeners.push(fn); } },
  },
};
const tick = ms => new Promise(r => setTimeout(r, ms));
</script>

<script>document.write('<scr'+'ipt src="/extension/content/quizSolver.js?t='+Date.now()+'"><\/scr'+'ipt>')</script>

<script>
const results = [];
const check = (n, ok, d) => results.push({ n, ok: !!ok, d: d === undefined ? '' : String(d) });

function dragOn(overlay, x1, y1, x2, y2) {
  const fire = (t, x, y) => overlay.dispatchEvent(
    new MouseEvent(t, { clientX: x, clientY: y, bubbles: true, cancelable: true }));
  fire('mousedown', x1, y1); fire('mousemove', x2, y2); fire('mouseup', x2, y2);
}

async function capture(qId) {
  captures.length = 0; solves.length = 0;
  const qEl = document.getElementById(qId);
  qEl.scrollIntoView({ block: 'start' });
  await tick(300);
  const scrollBefore = Math.round(window.scrollY);

  const cam = qEl.querySelector('.answerly-cam-btn');
  if (!cam) return { error: 'no camera button on ' + qId };
  cam.click();

  let overlay = null;
  for (let i = 0; i < 40 && !overlay; i++) { await tick(100); overlay = document.getElementById('answerly-stealth-overlay'); }
  if (!overlay) return { error: 'overlay never appeared for ' + qId };
  dragOn(overlay, 60, 80, 520, 420);

  // Overflow frames are 650ms apart; allow for two of them plus crop time.
  for (let i = 0; i < 60 && !solves.length; i++) await tick(100);
  await tick(300);
  return { captures: captures.length, solve: solves[0] || null,
           scrollYs: captures.map(c => c.scrollY),
           scrollBefore, scrollAfter: Math.round(window.scrollY) };
}

(async () => {
  await tick(3000);
  const camCount = document.querySelectorAll('.answerly-cam-btn').length;
  check('Classic: camera buttons injected on every question', camCount >= 4, 'found ' + camCount);

  // A. Control - a short question must still cost exactly one image.
  const a = await capture('question_1');
  check('A short question: ONE capture (no extra cost, no regression)',
        !a.error && a.captures === 1, a.error || ('captures=' + a.captures));
  check('A short question: single image, no images[] array',
        !a.error && a.solve && a.solve.n === 1, a.error || JSON.stringify(a.solve));

  // B. Regression - figure inside the container already overflowed before.
  const b = await capture('question_2');
  check('B tall question (figure INSIDE box): still captures 3 frames',
        !b.error && b.captures === 3, b.error || ('captures=' + b.captures));
  check('B tall question: sends 3 images as ONE question',
        !b.error && b.solve && b.solve.n === 3, b.error || JSON.stringify(b.solve));
  check('B tall question: actually scrolled between frames',
        !b.error && new Set(b.scrollYs).size === 3, b.error || JSON.stringify(b.scrollYs));

  // C. The fix - stem-only container, figure and choices laid out after it.
  const c = await capture('question_3');
  check('C stem-only container (THE FIX): captures 3 frames',
        !c.error && c.captures === 3, c.error || ('captures=' + c.captures));
  check('C stem-only container: sends 3 images as ONE question',
        !c.error && c.solve && c.solve.n === 3, c.error || JSON.stringify(c.solve));
  check('C stem-only container: scrolled to reach the choices',
        !c.error && new Set(c.scrollYs).size === 3, c.error || JSON.stringify(c.scrollYs));

  // D. The student's scroll position must come back, or their page jumps
  //    mid-exam - which in stealth is the one thing that must never happen.
  check('D scroll position restored after a 3-frame capture',
        !c.error && Math.abs(c.scrollAfter - c.scrollBefore) <= 2,
        c.error || ('before=' + c.scrollBefore + ' after=' + c.scrollAfter));
  check('D scroll restored after a 1-frame capture',
        !a.error && Math.abs(a.scrollAfter - a.scrollBefore) <= 2,
        a.error || ('before=' + a.scrollBefore + ' after=' + a.scrollAfter));

  // E. Nothing left behind on the page.
  check('E no overlay left in the DOM', !document.getElementById('answerly-stealth-overlay'));

  document.getElementById('log').innerHTML = results.map(r =>
    `<span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</span>  ${r.n}\n       ${r.d}`
  ).join('\n') + `\n\n${results.filter(r => r.ok).length}/${results.length} passed`;
  window.__results = results; window.__done = true;
})();
</script>
</body>
</html>
